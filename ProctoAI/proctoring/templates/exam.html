<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .timer {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .question-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        background-color: #f8f9fa;
      }
      .option-tile {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin: 5px 0;
        cursor: pointer;
      }
      .option-tile:hover,
      .selected {
        background-color: #0d6efd;
        color: white;
      }
      .submit-btn {
        background-color: #198754;
        color: white;
        font-size: 1.2rem;
      }
      /* Position the warning alert at the top-right */
      #warning-alert {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: none;
        padding: 12px 16px;
        border-radius: 6px;
        font-weight: 700;
        max-width: 420px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        word-wrap: break-word;
      }
      #warning-alert.warning {
        background-color: #ffcc00;
        color: #222;
      }
      #warning-alert.alert {
        background-color: #cc0000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <h1 class="text-center mb-4 text-primary">Exam Portal</h1>

          <!-- Exam Info -->
          <div class="text-center mb-3">
            <p>
              <strong>Full Marks:</strong> 100 | <strong>Pass Marks:</strong> 40
            </p>
          </div>

          <!-- Tab Switch Counter -->
          <div class="alert alert-danger text-center" id="tab-warning">
            Tab Switches: <span id="tab-count">{{ tab_count }},</span>/5
          </div>

          <!-- Timer -->
          <div id="timer" class="timer text-center mb-3">
            Time Left: <span id="time"></span>
          </div>

          <!-- Questions -->
          <form id="exam-form" method="post" action="{% url 'submit_exam' %}">
            {% csrf_token %}
            <input
              type="hidden"
              name="username"
              value="{{ user.first_name }}"
            />

            {% for question in questions %}
            <div class="question-card">
              <p class="question-text">
                <strong>{{ forloop.counter }}.</strong> {{ question.text }}
              </p>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}a')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}a"
                  value="A"
                  required
                />
                <label for="q{{ question.id }}a"
                  >A. {{ question.option_a }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}b')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}b"
                  value="B"
                />
                <label for="q{{ question.id }}b"
                  >B. {{ question.option_b }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}c')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}c"
                  value="C"
                />
                <label for="q{{ question.id }}c"
                  >C. {{ question.option_c }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}d')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}d"
                  value="D"
                />
                <label for="q{{ question.id }}d"
                  >D. {{ question.option_d }}</label
                >
              </div>
            </div>
            {% endfor %}

            <!-- Submit Button -->
            <div class="text-center mt-4">
              <button type="submit" class="btn submit-btn">Submit Exam</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Real-time warning alert (now pure red) -->
    <!-- <div
      id="warning-alert"
      class="alert"
      style="
        display: none;
        background-color: #ff0000;
        color: white;
        font-weight: bold;
      "
    ></div> -->
    <div id="warning-alert" aria-live="polite" role="status"></div>

    <script>
        // Timer Logic
        let totalTime = 5 * 60; // 5 minutes in seconds
        const timerElement = document.getElementById("time");

        function startTimer() {
          const timer = setInterval(() => {
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            timerElement.textContent = `${minutes}:${
              seconds < 10 ? "0" : ""
            }${seconds}`;

            if (totalTime === 0) {
              clearInterval(timer);
              alert("Time's up! Submitting the exam.");
              document.getElementById("exam-form").submit();
            }
            totalTime--;
          }, 1000);
        }
        window.onload = startTimer;

        // Function to handle option selection
        function selectOption(optionTile, inputId) {
          const questionCard = optionTile.closest(".question-card");
          questionCard.querySelectorAll(".option-tile").forEach((tile) => {
            tile.classList.remove("selected");
          });
          optionTile.classList.add("selected");
          document.getElementById(inputId).checked = true;
        }

        // Fetch real-time warnings
        function checkWarnings() {
          fetch("/get_warning/")
            .then((response) => response.json())
            .then((data) => {
              if (data.warning) {
                const warningAlert = document.getElementById("warning-alert");
                warningAlert.textContent = data.warning;
                warningAlert.style.display = "block";
              }
            });
        }
        setInterval(checkWarnings, 5000);

        // Prevent right-click
        document.addEventListener("contextmenu", (e) => e.preventDefault());

        // Prevent tab switching
        window.addEventListener("blur", () => {
          alert("You cannot switch tabs or windows during the exam!");
          window.focus();
        });

        // Prevent exiting fullscreen mode
        document.addEventListener("fullscreenchange", () => {
          if (!document.fullscreenElement) {
            alert("You cannot exit fullscreen mode during the exam!");
            document.documentElement.requestFullscreen();
          }
        });


          // Enter fullscreen mode
          document.documentElement.requestFullscreen();

          // Initialize the tab switch count (defaulting to 0 if not provided)
          let tabSwitchCount = {{ tab_count|default:0 }};

          // Keep track of the previous visibility state
          let lastVisibilityState = document.visibilityState;

          // Define the tab switch handler
          function tabSwitchHandler() {
            // Only count a switch if the page goes from 'visible' to 'hidden'
            if (lastVisibilityState === 'visible' && document.visibilityState === 'hidden') {
              tabSwitchCount++;
              document.getElementById("tab-count").textContent = tabSwitchCount;

              // Send a POST request to record the tab switch
              fetch("{% url 'record_tab_switch' %}", {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" },
              })
              .then(response => response.json())
              .then(data => {
                 // If termination condition is met, alert and redirect (or submit termination logic)
                 if (data.status === "terminated") {
                   alert(data.message);
                   // Redirect to a termination page or home (ensure you have this URL configured)
                   window.location.href = "{% url 'exam_submission_success' %}";
                 } else {
                   // Optionally alert on each tab switch when exam is ongoing
                   if (tabSwitchCount >= 1) {
                     alert("Warning: Tab switch detected! Total switches: " + tabSwitchCount);
                   }
                 }
              })
              .catch(error => console.error('Error:', error));
            }
            // Update the last known visibility state
            lastVisibilityState = document.visibilityState;
          }

          // Listen for visibility changes
          document.addEventListener("visibilitychange", tabSwitchHandler);

          // Prevent accidental closing or refreshing of the exam page
          window.onbeforeunload = function () {
            return "You are in the middle of an exam! Are you sure you want to leave?";
          };

          // When the exam is submitted, remove the event listener and onbeforeunload warning
          document.getElementById("exam-form").addEventListener("submit", function () {
            window.onbeforeunload = null;
            document.removeEventListener("visibilitychange", tabSwitchHandler);
          });

          /*
          -----------NEW BRIGHTNESS FEATURE-----------------
          */

          // Poll server for warnings and show banner
      (function () {
        const WARNING_URL = "{% url 'get_warning' %}"; // template URL (adjust if your URL name differs)
        const POLL_INTERVAL_MS = 2000; // 2 seconds
        const banner = document.getElementById('warning-alert');
        let lastText = null;

        function showBanner(text, level) {
          banner.textContent = text;
          banner.classList.remove('warning', 'alert');
          if (level === 'warning') banner.classList.add('warning');
          if (level === 'alert') banner.classList.add('alert');
          banner.style.display = 'block';
        }

        function hideBanner() {
          banner.style.display = 'none';
          banner.classList.remove('warning', 'alert');
          lastText = null;
        }

        async function pollWarning() {
          try {
            const res = await fetch(WARNING_URL, { cache: 'no-store' });
            if (!res.ok) {
              // endpoint might not exist in this name/path; silently skip
              return;
            }
            const data = await res.json();
            const w = data.warning || null;
            if (!w) {
              if (lastText !== null) hideBanner();
              return;
            }
            // severity heuristics
            let level = 'warning';
            if (w.toLowerCase().includes('alert')) level = 'alert';
            else if (w.toLowerCase().includes('warning')) level = 'warning';

            if (w !== lastText) {
              showBanner(w, level);
              lastText = w;
            }
          } catch (err) {
            console.debug('Warning poll error', err);
          }
        }

        // start polling
        setInterval(pollWarning, POLL_INTERVAL_MS);
        pollWarning();
      })();

      /*
          -----------NEW BRIGHTNESS FEATURE END-----------------
          */
    </script>
  </body>
</html>
