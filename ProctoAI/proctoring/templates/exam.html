<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .timer {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .question-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        background-color: #f8f9fa;
      }
      .option-tile {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin: 5px 0;
        cursor: pointer;
      }
      .option-tile:hover,
      .selected {
        background-color: #0d6efd;
        color: white;
      }
      .submit-btn {
        background-color: #198754;
        color: white;
        font-size: 1.2rem;
      }
      /* Position the warning alert at the top-right */
      #warning-alert {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: none;
        padding: 12px 16px;
        border-radius: 6px;
        font-weight: 700;
        max-width: 420px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        word-wrap: break-word;
      }
      #warning-alert.warning {
        background-color: #ffcc00;
        color: #222;
      }
      #warning-alert.alert {
        background-color: #cc0000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <h1 class="text-center mb-4 text-primary">Exam Portal</h1>

          <!-- Exam Info -->
          <div class="text-center mb-3">
            <p>
              <strong>Full Marks:</strong> 100 | <strong>Pass Marks:</strong> 40
            </p>
          </div>

          <!-- Tab Switch Counter -->
          <div class="alert alert-danger text-center" id="tab-warning">
            Tab Switches:
            <span id="tab-count">{{ tab_count|default:0 }}</span>/
            <span id="tab-limit">{{ tab_limit|default:5 }}</span>
          </div>

          <!-- Timer -->
          <div id="timer" class="timer text-center mb-3">
            Time Left: <span id="time"></span>
          </div>

          <!-- Questions -->
          <form id="exam-form" method="post" action="{% url 'submit_exam' %}">
            {% csrf_token %}
            <input
              type="hidden"
              name="username"
              value="{{ user.first_name }}"
            />

            {% for question in questions %}
            <div class="question-card">
              <p class="question-text">
                <strong>{{ forloop.counter }}.</strong> {{ question.text }}
              </p>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}a')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}a"
                  value="A"
                  required
                />
                <label for="q{{ question.id }}a"
                  >A. {{ question.option_a }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}b')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}b"
                  value="B"
                />
                <label for="q{{ question.id }}b"
                  >B. {{ question.option_b }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}c')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}c"
                  value="C"
                />
                <label for="q{{ question.id }}c"
                  >C. {{ question.option_c }}</label
                >
              </div>
              <div
                class="option-tile"
                onclick="selectOption(this, 'q{{ question.id }}d')"
              >
                <input
                  type="radio"
                  name="answer_{{ question.id }}"
                  id="q{{ question.id }}d"
                  value="D"
                />
                <label for="q{{ question.id }}d"
                  >D. {{ question.option_d }}</label
                >
              </div>
            </div>
            {% endfor %}

            <!-- Submit Button -->
            <div class="text-center mt-4">
              <button type="submit" class="btn submit-btn">Submit Exam</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Real-time warning alert (now pure red) -->
    <!-- <div
      id="warning-alert"
      class="alert"
      style="
        display: none;
        background-color: #ff0000;
        color: white;
        font-weight: bold;
      "
    ></div> -->
    <div id="warning-alert" aria-live="polite" role="status"></div>

    <!-- ...existing code... -->
    <script>
          // Timer Logic
          let totalTime = 5 * 60; // 5 minutes in seconds
          const timerElement = document.getElementById("time");

          function startTimer() {
            const timer = setInterval(() => {
              const minutes = Math.floor(totalTime / 60);
              const seconds = totalTime % 60;
              timerElement.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

              if (totalTime === 0) {
                clearInterval(timer);
                // Non-blocking banner instead of alert
                showLocalBanner("Time's up! Submitting the exam.", 'alert');
                document.getElementById("exam-form").submit();
              }
              totalTime--;
            }, 1000);
          }
          window.onload = startTimer;

          // Function to handle option selection
          function selectOption(optionTile, inputId) {
            const questionCard = optionTile.closest(".question-card");
            questionCard.querySelectorAll(".option-tile").forEach((tile) => {
              tile.classList.remove("selected");
            });
            optionTile.classList.add("selected");
            document.getElementById(inputId).checked = true;
          }

          // Remove old polling (duplicate) to avoid conflicts
          // function checkWarnings() { ... }
          // setInterval(checkWarnings, 5000);

          // Prevent right-click
          document.addEventListener("contextmenu", (e) => e.preventDefault());

          // IMPORTANT: Remove focus-alert loop on window blur
          // window.addEventListener("blur", () => {
          //   alert("You cannot switch tabs or windows during the exam!");
          //   window.focus();
          // });

          // Fullscreen change: do not force re-enter or alert in a loop
          document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
              // Use non-blocking banner; do not call requestFullscreen() here
              showLocalBanner("Fullscreen exited. Please re-enter fullscreen for proctoring.", 'warning');
            }
          });

          // Enter fullscreen once (user gesture recommended)
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {
              // Show banner instead of alert on failure
              showLocalBanner("Unable to enter fullscreen automatically. Please press F11 or use browser controls.", 'warning');
            });
          }

          function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

          // Initialize the tab switch count
          let tabSwitchCount = {{ tab_count|default:0 }};

          // Track last visibility and debounce rapid repeats
          let lastVisibilityState = document.visibilityState;
          let lastSwitchAt = 0;
          const SWITCH_DEBOUNCE_MS = 1500;

          // Local banner helper (reuses #warning-alert; non-blocking)
          const banner = document.getElementById('warning-alert');
          function showLocalBanner(text, level = 'warning') {
            // If server banner is already showing ALERT, prefer not to override severity
            banner.textContent = text;
            banner.classList.remove('warning', 'alert');
            if (level === 'alert') banner.classList.add('alert');
            else banner.classList.add('warning');
            banner.style.display = 'block';
            // auto-hide after 5s for local messages
            setTimeout(() => {
              // Only hide if server polling hasn’t set a new message
              if (!banner.dataset.locked) {
                banner.style.display = 'none';
                banner.classList.remove('warning', 'alert');
              }
            }, 5000);
          }

          // Tab/window switch detection using visibilitychange only
          async function tabSwitchHandler() {
            const now = Date.now();
            // Only count when going from visible -> hidden (covers tab and app switch)
            if (lastVisibilityState === 'visible' && document.visibilityState === 'hidden') {
              // debounce to avoid repeated triggers from modal UI/focus changes
              if (now - lastSwitchAt < SWITCH_DEBOUNCE_MS) {
                lastVisibilityState = document.visibilityState;
                return;
              }
              lastSwitchAt = now;

              tabSwitchCount++;
              document.getElementById("tab-count").textContent = tabSwitchCount;

              // POST to record the switch (no alert loop; show banner instead)
              try {
                const res = await fetch("{% url 'record_tab_switch' %}", {
                  method: "POST",
                  headers: { "X-CSRFToken": "{{ csrf_token }}" },
                });
                const data = await res.json();
                if (data.status === "terminated") {
                  showLocalBanner(data.message, 'alert');
                  window.location.href = "{% url 'exam_submission_success' %}";
                } else {
                  showLocalBanner(`Warning: Tab/window switch detected! Total: ${tabSwitchCount}`, 'warning');
                }
              } catch (e) {
                console.debug("tab switch post error", e);
              }
            }
            lastVisibilityState = document.visibilityState;
          }
          document.addEventListener("visibilitychange", tabSwitchHandler);

          // Prevent accidental closing or refreshing of the exam page
          window.onbeforeunload = function () {
            return "You are in the middle of an exam! Are you sure you want to leave?";
          };

          // When the exam is submitted, remove the listener and onbeforeunload warning
          document.getElementById("exam-form").addEventListener("submit", function () {
            window.onbeforeunload = null;
            document.removeEventListener("visibilitychange", tabSwitchHandler);
          });

          /*
          ----------- SERVER WARNING POLLER (kept) -----------------
          */
          (function () {
            const WARNING_URL = "{% url 'get_warning' %}";
            const POLL_INTERVAL_MS = 2000; // 2 seconds
            let lastText = null;

            function showServerBanner(text, level) {
              // Lock banner so local auto-hide doesn’t hide server messages
              banner.dataset.locked = "1";
              banner.textContent = text;
              banner.classList.remove('warning', 'alert');
              if (level === 'alert') banner.classList.add('alert');
              else banner.classList.add('warning');
              banner.style.display = 'block';
            }

            function clearServerBanner() {
              delete banner.dataset.locked;
              banner.style.display = 'none';
              banner.classList.remove('warning', 'alert');
              lastText = null;
            }

            async function pollWarning() {
              try {
                const res = await fetch(WARNING_URL, { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                const w = data.warning || null;
                if (!w) {
                  // only clear if we own the lock
                  if (banner.dataset.locked) clearServerBanner();
                  return;
                }
                let level = 'warning';
                if (w.toLowerCase().includes('alert')) level = 'alert';
                else if (w.toLowerCase().includes('warning')) level = 'warning';

                if (w !== lastText) {
                  showServerBanner(w, level);
                  lastText = w;
                }
              } catch (err) {
                console.debug('Warning poll error', err);
              }
            }
            setInterval(pollWarning, POLL_INTERVAL_MS);
            pollWarning();
          })();
          /*
          ----------- SERVER WARNING POLLER END -----------------
          */
    </script>
    <!-- ...existing code... -->
  </body>
</html>
